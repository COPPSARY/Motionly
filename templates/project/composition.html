<template id="starter-template">
  <style>
    .starter { position:absolute; inset:0; overflow:hidden; background:radial-gradient(circle at 80% 70%,#173c39,transparent 34%),radial-gradient(circle at 14% 18%,#35225e,transparent 30%),#070910; color:white; font-family:Inter,sans-serif; }
    .starter::before { position:absolute; inset:0; opacity:.2; background-image:linear-gradient(#ffffff10 1px,transparent 1px),linear-gradient(90deg,#ffffff10 1px,transparent 1px); background-size:52px 52px; content:""; }
    .starter-lockup { position:absolute; inset:0; display:grid; place-items:center; text-align:center; }
    .starter-lockup h1 { margin:0; font-size:140px; line-height:.9; letter-spacing:-.065em; transform-origin:center; }
    .starter-lockup p { margin:28px 0 0; color:#aeb3bf; font-size:34px; }
    .starter-product { position:absolute; inset:140px 120px 110px; display:grid; grid-template-columns:1fr 110px 1fr; gap:30px; align-items:center; visibility:hidden; opacity:0; }
    .starter-card { height:620px; overflow:hidden; border:1px solid #ffffff24; border-radius:28px; background:#0c0d13; box-shadow:0 50px 120px #000a; }
    .starter-card header { height:70px; display:flex; align-items:center; padding:0 28px; border-bottom:1px solid #ffffff16; color:#8f95a3; font:18px ui-monospace,monospace; }
    .starter-code { padding:48px; color:#abb1bf; font:25px/1.8 ui-monospace,monospace; }
    .starter-code b { color:#d8ff55; }.starter-code em { color:#72e4d1; font-style:normal; }
    .starter-route { height:2px; position:relative; background:linear-gradient(90deg,#8b6cff,#d8ff55); transform-origin:left; }
    .starter-output { height:100%; display:grid; place-items:center; background:radial-gradient(circle at 70% 25%,#4b307e,transparent 40%),#12121a; }
    .starter-output h2 { margin:0; font-size:76px; line-height:.95; letter-spacing:-.055em; text-align:center; }.starter-output span { display:block; color:#d8ff55; }
  </style>
  <main class="starter">
    <section class="starter-lockup scene" data-scene="hero">
      <div><h1 data-edit="hero-title">Build the moment.</h1><p data-edit="hero-subtitle">HTML is the canvas. GSAP directs the motion.</p></div>
    </section>
    <section class="starter-product scene" data-scene="proof" data-edit="product-stage">
      <article class="starter-card starter-source"><header>timeline.js</header><div class="starter-code"><b>timeline</b>.add(<br>&nbsp;&nbsp;<em>productReveal</em>(),<br>&nbsp;&nbsp;2.4<br>);</div></article>
      <div class="starter-route"></div>
      <article class="starter-card starter-output"><h2>Code becomes<span>motion.</span></h2></article>
    </section>
  </main>
</template>
