<template id="flowdesk-preset-template">
  <!-- Author visual source: Flowdesk SaaS Product Film (Silicon Valley Standard) -->
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700;800&display=swap");

    .flowdesk-stage {
      --bg: #faf9f6;
      --ink: #0f172a;
      --muted: #64748b;
      --brand: #4f46e5; /* Indigo */
      --brand-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #9333ea 100%);
      --brand-light: #eef2ff;
      --brand-glow: rgba(79, 70, 229, 0.22);
      --red: #ef4444;
      --red-light: #fef2f2;
      --emerald: #10b981;
      --amber: #f59e0b;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;

      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--bg);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      isolation: isolate;
      perspective: 1400px;
    }

    .flowdesk-stage * {
      box-sizing: border-box;
    }

    /* ── Luminous Ambient Atmosphere & Breathing Waves ── */
    .world-canvas {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 15% 85%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 15%, rgba(168, 85, 247, 0.12) 0%, transparent 40%),
        linear-gradient(135deg, #fdfcfb 0%, #f7f6f2 60%, #f0eee7 100%);
      transform-origin: center;
      z-index: 1;
    }

    .ambient-mesh {
      position: absolute;
      inset: -20%;
      filter: blur(80px) saturate(140%);
      opacity: 0.85;
      pointer-events: none;
      z-index: 2;
    }

    .aurora-bloom-1 {
      position: absolute;
      left: 20%;
      top: 25%;
      width: 550px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(79, 70, 229, 0.2) 0%, transparent 70%);
    }

    .aurora-bloom-2 {
      position: absolute;
      right: 20%;
      bottom: 25%;
      width: 600px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(147, 51, 234, 0.18) 0%, transparent 70%);
    }

    .tech-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(203, 213, 225, 0.4) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(203, 213, 225, 0.4) 1px, transparent 1px);
      background-size: 64px 64px;
      z-index: 3;
      opacity: 0.65;
    }

    /* ── SCENE 1: Free Canvas Kinetic Typography (NO BOX!) ── */
    .editorial-stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .editorial-beat {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: max-content;
      max-width: 95vw;
      white-space: nowrap;
      opacity: 0;
      transform-origin: center;
    }

    .editorial-headline {
      margin: 0;
      font-size: clamp(46px, 5.2vw, 74px);
      font-weight: 800;
      letter-spacing: -0.045em;
      line-height: 1.15;
      color: var(--ink);
    }

    .gradient-word {
      display: inline-block;
      background: var(--brand-gradient);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .drum-ticker-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 24px;
    }

    .drum-pill {
      font-size: 18px;
      font-weight: 700;
      padding: 8px 18px;
      border-radius: 30px;
      background: #ffffff;
      border: 1.5px solid var(--border);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.05);
      color: var(--muted);
      opacity: 0;
      transform: translateY(16px) scale(0.92);
      filter: blur(6px);
    }

    .drum-pill.urgent {
      border-color: var(--red);
      background: var(--red-light);
      color: var(--red);
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.15);
    }

    /* ── SCENE 2: 2.5D Isometric Chaos Message Cascade ── */
    .friction-stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 12;
      opacity: 0;
      pointer-events: none;
    }

    .friction-title-wrap {
      position: absolute;
      top: 10%;
      text-align: center;
    }

    .friction-title {
      font-size: clamp(40px, 4.5vw, 62px);
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--ink);
      margin: 0;
    }

    .cascade-stack {
      position: relative;
      width: 780px;
      height: 380px;
      transform-style: preserve-3d;
      transform: rotateX(16deg) rotateY(-12deg) rotateZ(3deg);
    }

    .cascade-card {
      position: absolute;
      width: 680px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 25px 50px -10px rgba(15, 23, 42, 0.12);
      padding: 18px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      opacity: 0;
      transform-origin: center;
    }

    .card-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sender-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 13px;
      color: #ffffff;
    }

    .tag-badge {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.04em;
    }

    .card-message-text {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.4;
      color: var(--ink);
    }

    .card-footer-sla {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }

    /* ── SCENE 3 & 4: Production Desktop SaaS Interface ── */
    .workspace-window {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 1080px;
      height: 600px;
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 22px;
      box-shadow:
        0 35px 80px -15px rgba(15, 23, 42, 0.15),
        0 0 0 1px rgba(255, 255, 255, 0.8) inset;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      z-index: 15;
      opacity: 0;
      transform-origin: center;
    }

    .window-titlebar {
      height: 46px;
      background: #f8fafc;
      border-bottom: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
    }

    .mac-window-dots {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mac-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }

    .dot-red { background: #ff5f56; border: 1px solid #e0443e; }
    .dot-yellow { background: #ffbd2e; border: 1px solid #dea123; }
    .dot-green { background: #27c93f; border: 1px solid #1aab29; }

    .window-url-pill {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .window-main-content {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* App Left Sidebar */
    .app-sidebar {
      width: 220px;
      background: #f8fafc;
      border-right: 1.5px solid var(--border);
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sidebar-brand-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--brand);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding-left: 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }

    .nav-item.active {
      background: var(--brand-light);
      color: var(--brand);
      font-weight: 700;
    }

    /* App Center Ticket List */
    .app-ticket-list {
      flex: 1;
      padding: 18px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #ffffff;
    }

    .list-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .list-row-item {
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03);
      transform-origin: center;
      transition: all 0.2s;
    }

    .list-row-item.highlighted {
      border-color: var(--brand);
      background: #fafbff;
      box-shadow: 0 8px 24px var(--brand-glow);
    }

    /* App Right AI Copilot Drawer */
    .ai-copilot-drawer {
      width: 360px;
      background: #fdfdfd;
      border-left: 1.5px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transform: translateX(100%);
      opacity: 0;
    }

    .copilot-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .copilot-tag {
      background: var(--brand-light);
      color: var(--brand);
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .step-surge-track {
      width: 120px;
      height: 6px;
      background: #e2e8f0;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .step-surge-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: var(--brand-gradient);
    }

    .suggested-reply-box {
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      font-size: 14px;
      line-height: 1.5;
      color: var(--ink);
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.04);
      min-height: 160px;
      position: relative;
    }

    .typing-caret {
      display: inline-block;
      width: 2px;
      height: 16px;
      background: var(--brand);
      margin-left: 2px;
      vertical-align: middle;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .approve-action-pill {
      width: 100%;
      background: var(--brand);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 10px 20px rgba(79, 70, 229, 0.28);
      cursor: pointer;
      transform-origin: center;
    }

    /* ── SCENE 5: Outro Brand Lockup ── */
    .outro-stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
    }

    .outro-content {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .brand-logo-lockup {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: clamp(56px, 6vw, 84px);
      font-weight: 900;
      letter-spacing: -0.04em;
      color: var(--ink);
    }

    .outro-tagline {
      font-size: clamp(22px, 2.4vw, 32px);
      font-weight: 700;
      color: var(--muted);
      letter-spacing: -0.02em;
    }

    .cta-pill-button {
      background: var(--ink);
      color: #ffffff;
      padding: 16px 40px;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.01em;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.2);
      margin-top: 8px;
    }

    /* Interactive Cursor Hand */
    .flowdesk-cursor {
      position: absolute;
      width: 44px;
      height: 44px;
      z-index: 40;
      pointer-events: none;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.18));
      opacity: 0;
    }
  </style>
